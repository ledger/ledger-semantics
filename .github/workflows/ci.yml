name: CI

on:
  push:
    branches: main
  pull_request:
  merge_group:
    branches: main

jobs:
  proofs:
    name: Build oracle and check proofs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The flake declares one `deps` fixed-output hash for every
        # platform, measured byte-identical on x86_64-linux,
        # aarch64-linux and aarch64-darwin, and each of the three has
        # a leg here.  x86_64-darwin has none: the pinned nixpkgs has
        # dropped that platform ("Nixpkgs 26.11 has dropped support for
        # x86_64-darwin"), so the flake no longer lists it either.
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v7

      # Cache the Nix store between runs.  The oracle depends on the
      # Mathlib artifact tree (the flake's `deps` fixed-output
      # derivation, several gigabytes), which would otherwise be
      # fetched on every run.  The key follows the toolchain pins, so
      # an upgrade rebuilds the cache exactly once.
      #
      # The aarch64-linux leg skips the cache deliberately.  `deps` is a
      # fixed-output derivation, so its store path is a function of its
      # declared outputHash and name only — not of the system — and the
      # cache key is keyed on `runner.os`, which does not distinguish
      # architectures: the leg would restore ubuntu-latest's store, find
      # the path already valid, skip the fetch, and verify nothing.  An
      # unseeded store forces the fetch, and a hash mismatch there
      # (`hash mismatch in fixed-output derivation ... got: sha256-...`)
      # means a platform-specific file survived the flake's
      # normalization.
      - uses: nix-community/cache-nix-action@v6
        if: ${{ matrix.os != 'ubuntu-24.04-arm' }}
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'lake-manifest.json', 'lean-toolchain') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 10G
          gc-max-store-size-macos: 10G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # `nix build` compiles every module.  The lakefile turns warnings
      # into errors, so an unproved theorem (`sorry`) fails this step:
      # a green build is a checked proof of every stated theorem.
      - name: Build the oracle (checks all proofs)
        run: nix build .#oracle -L

      # A smoke test of the executable layer: the oracle must evaluate
      # a minimal journal and print the documented row format.  The
      # test runs inside the built store path; the oracle tree is
      # read-only by design.
      - name: Oracle smoke test
        run: |
          cat > /tmp/smoke.dat <<'EOF'
          2026/01/01 Opening
              Assets:Cash        $100.00
              Equity:Opening
          EOF
          oracle=$(nix build .#oracle --print-out-paths)
          nix develop --command bash -c \
            "cd $oracle && lake env lean --run Ledger/Driver.lean /tmp/smoke.dat" \
            | tee /tmp/smoke.out
          grep -q '^\$|100|Assets:Cash$' /tmp/smoke.out
          grep -q '^\$|-100|Equity:Opening$' /tmp/smoke.out
